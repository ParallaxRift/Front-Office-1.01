# Runs 3 times a day, and any time you press "Run workflow".
#  Player list and career stats, both from Sleeper -> data/players.json and data/sleeper-players.json
# Market values are NOT made here: Front Office reads them from the Rankings Desk's published file.
name: Update values

on:
  schedule:
    - cron: "0 11 * * *"   # every day at 11:00 UTC (6 or 7 AM Eastern)
    - cron: "0 17 * * *"   # midday refresh (noon Eastern)
    - cron: "0 23 * * *"   # evening refresh, after practice reports come out (6 or 7 PM Eastern)
  workflow_dispatch:        # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write           # lets the workflow save the data files back to the repo

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Sleeper players and stats
        run: python scripts/update_players.py

      - name: Save the new data files
        run: |
          git config user.name "front-office-bot"
          git config user.email "front-office-bot@users.noreply.github.com"
          # One-time cleanup: the old FantasyPros files and script are removed from Front Office
          git rm -r -q --ignore-unmatch data/values.json data/values-status.json data/rank-history.json data/history data/fp-injuries data/fp-status.json scripts/update_values.py
          [ -f data/players.json ] && git add data/players.json
          [ -f data/sleeper-players.json ] && git add data/sleeper-players.json
          [ -d data/season-stats ] && git add data/season-stats
          if git diff --cached --quiet; then
            echo "Data unchanged."
          else
            git commit -m "Daily data update"
            git pull --rebase -X theirs origin main
            git push
          fi
