# Runs the daily updates once a day, and any time you press "Run workflow".
#  1. FantasyPros values      -> data/values.json
#  2. Player card stats (Sleeper) + injury reports (FantasyPros) -> data/players.json
name: Update values

on:
  schedule:
    - cron: "0 11 * * *"   # every day at 11:00 UTC (6 or 7 AM Eastern): values, stats, injuries, news
    - cron: "0 17 * * *"   # midday refresh, mostly for fresh injury news (noon Eastern)
    - cron: "0 23 * * *"   # evening refresh, after practice reports come out (6 or 7 PM Eastern)
  workflow_dispatch:        # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write           # lets the workflow save the data files back to the repo

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download FantasyPros rankings and build values
        env:
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
        run: python scripts/update_values.py

      - name: Download career stats and injury history for player cards
        continue-on-error: true   # if this fails, values still save
        env:
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
        run: python scripts/update_players.py

      - name: Save the new data files
        run: |
          git config user.name "front-office-bot"
          git config user.email "front-office-bot@users.noreply.github.com"
          git add data/values.json
          [ -f data/players.json ] && git add data/players.json
          [ -d data/fp-injuries ] && git add data/fp-injuries
          [ -d data/season-stats ] && git add data/season-stats
          [ -f data/fp-status.json ] && git add data/fp-status.json
          if git diff --cached --quiet; then
            echo "Data unchanged today."
          else
            git commit -m "Daily data update"
            git pull --rebase -X theirs origin main
            git push
          fi
